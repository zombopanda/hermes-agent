name: PR60359 one-shot runner

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.title == 'RUN PR60359 FIXER' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/channel-overrides-model-effort' &&
      github.event.pull_request.user.login == 'zombopanda'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zombopanda/hermes-agent
          ref: agent/channel-overrides-model-effort
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Apply fix
        run: python .github/pr60359_fix.py

      - name: Focused validation
        run: |
          uv run --extra dev pytest -q \
            tests/gateway/test_channel_overrides.py \
            tests/gateway/test_config.py \
            tests/gateway/test_session_model_override_routing.py \
            tests/run_agent/test_provider_fallback.py \
            tests/run_agent/test_switch_model_reasoning_override.py
          uv run --extra dev ruff check \
            agent/agent_init.py \
            agent/agent_runtime_helpers.py \
            agent/chat_completion_helpers.py \
            gateway/run.py \
            tests/gateway/test_channel_overrides.py \
            tests/run_agent/test_provider_fallback.py \
            tests/run_agent/test_switch_model_reasoning_override.py
          git diff --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/pr60359_fix.py .github/workflows/pr60359-fix.yml
          git add -- \
            agent/agent_init.py \
            agent/agent_runtime_helpers.py \
            agent/chat_completion_helpers.py \
            gateway/run.py \
            tests/gateway/test_channel_overrides.py \
            tests/run_agent/test_provider_fallback.py \
            tests/run_agent/test_switch_model_reasoning_override.py \
            website/docs/user-guide/messaging/index.md
          git diff --cached --check
          git commit -m "fix(gateway): preserve scoped reasoning across route changes"
          git push origin HEAD:agent/channel-overrides-model-effort
