name: Resolve PR 77402 conflict (final)

on:
  push:
    branches:
      - agent/pr-77402-resolution-20260811

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Build feature commit on current upstream main
        shell: bash
        run: |
          set -euo pipefail

          git reset --hard 9829746dfe3d5077f4f076e257505ec7f8feaa65

          python - <<'PY'
          from pathlib import Path

          scheduler = Path("cron/scheduler.py")
          text = scheduler.read_text(encoding="utf-8")
          replacements = [
              (
                  """def _run_job_script(
              script_path: str,
              workdir: Optional[str] = None,
          ) -> tuple[bool, str]:""",
                  """def _run_job_script(
              script_path: str,
              workdir: Optional[str] = None,
              job_env: Optional[dict[str, str]] = None,
          ) -> tuple[bool, str]:""",
              ),
              (
                  """        env = build_subprocess_env()
                  env.update(env_overlay)
                  # Use the job's workdir as the subprocess cwd when configured,""",
                  """        env = build_subprocess_env()
                  env.update(env_overlay)
                  if job_env:
                      env.update(job_env)
                  # Use the job's workdir as the subprocess cwd when configured,""",
              ),
              (
                  """def _run_job_script_with_claim_heartbeat(
              job: dict, script_path: str, workdir: Optional[str] = None,
          ) -> tuple[bool, str]:""",
                  """def _run_job_script_with_claim_heartbeat(
              job: dict,
              script_path: str,
              workdir: Optional[str] = None,
              job_env: Optional[dict[str, str]] = None,
          ) -> tuple[bool, str]:""",
              ),
              (
                  """        return _run_job_script(script_path, workdir=workdir)

              job_id = str(job.get(\"id\") or \"\")""",
                  """        return _run_job_script(script_path, workdir=workdir, job_env=job_env)

              job_id = str(job.get(\"id\") or \"\")""",
              ),
              (
                  """        return _run_job_script(script_path, workdir=workdir)

              try:
                  return _run_job_script(script_path, workdir=workdir)
              finally:""",
                  """        return _run_job_script(script_path, workdir=workdir, job_env=job_env)

              try:
                  return _run_job_script(script_path, workdir=workdir, job_env=job_env)
              finally:""",
              ),
              (
                  """            ok, output = _run_job_script_with_claim_heartbeat(
                          job, script_path, workdir=_job_workdir,
                      )""",
                  """            ok, output = _run_job_script_with_claim_heartbeat(
                          job,
                          script_path,
                          workdir=_job_workdir,
                          job_env={
                              \"HERMES_CRON_JOB_ID\": str(job_id),
                              \"HERMES_CRON_OCCURRENCE_AT\": str(job.get(\"next_run_at\") or \"\"),
                          },
                      )""",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one scheduler match, got {count}: {old[:80]!r}"
                  )
              text = text.replace(old, new, 1)
          scheduler.write_text(text, encoding="utf-8")

          test = Path("tests/cron/test_cron_script.py")
          text = test.read_text(encoding="utf-8")
          needle = '''        assert success is True
                  assert output == "ABSENT"

              @pytest.mark.windows_only
          '''
          addition = '''        assert success is True
                  assert output == "ABSENT"

              def test_script_receives_explicit_job_environment(self, cron_env):
                  from cron.scheduler import _run_job_script

                  script = cron_env / "scripts" / "occurrence.py"
                  script.write_text(
                      "import os\\n"
                      "print(os.environ['HERMES_CRON_JOB_ID'])\\n"
                      "print(os.environ['HERMES_CRON_OCCURRENCE_AT'])\\n"
                  )

                  success, output = _run_job_script(
                      "occurrence.py",
                      job_env={
                          "HERMES_CRON_JOB_ID": "job-123",
                          "HERMES_CRON_OCCURRENCE_AT": "2026-08-03T10:15:00+00:00",
                      },
                  )

                  assert success is True
                  assert output.splitlines() == [
                      "job-123",
                      "2026-08-03T10:15:00+00:00",
                  ]

              @pytest.mark.windows_only
          '''
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f"expected exactly one test insertion point, got {count}")
          test.write_text(text.replace(needle, addition, 1), encoding="utf-8")
          PY

          python -m py_compile cron/scheduler.py tests/cron/test_cron_script.py
          git diff --check
          git diff --stat

          git add cron/scheduler.py tests/cron/test_cron_script.py
          git -c user.name=zombopanda \
              -c user.email=1810282+zombopanda@users.noreply.github.com \
              commit -m "feat(cron): expose scheduled occurrence to scripts"
          git push origin HEAD:refs/heads/agent/feat-cron-occurrence-env
