name: Finish A2A message-id cleanup v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-a2a-message-id-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/a2a-preserve-streamed-final
          fetch-depth: 1
          persist-credentials: true
      - name: Make A2A reply ids collision-safe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          path = Path("plugins/platforms/a2a/adapter.py")
          text = path.read_text()
          if "import uuid\n" not in text:
              text = text.replace("import urllib.request\n", "import urllib.request\nimport uuid\n", 1)
          old = "        message_id = str(int(time.time() * 1000))\n"
          if old not in text:
              raise SystemExit("message-id anchor changed")
          path.write_text(text.replace(old, "        message_id = uuid.uuid4().hex\n", 1))
          PY

          cat > tests/plugins/test_a2a_message_ids.py <<'PY'
          """Regression coverage for A2A outbound reply identifiers."""
          import asyncio

          from plugins.platforms.a2a.adapter import A2AAdapter


          def _bare_adapter():
              adapter = object.__new__(A2AAdapter)
              adapter._pending = {}
              adapter._pending_by_context = {}
              adapter._pending_lock = __import__("threading").Lock()
              return adapter


          def test_back_to_back_final_sends_have_unique_message_ids():
              adapter = _bare_adapter()

              async def run():
                  first = await adapter.send("ctx-1", "one", metadata={"notify": True})
                  second = await adapter.send("ctx-2", "two", metadata={"notify": True})
                  return first, second

              first, second = asyncio.run(run())
              assert first.success is True
              assert second.success is True
              assert first.message_id
              assert second.message_id
              assert first.message_id != second.message_id
          PY

          python -m pip install --quiet uv
          uv run --extra dev pytest -q tests/plugins/test_a2a_plugin.py tests/plugins/test_a2a_phase23.py tests/plugins/test_a2a_message_ids.py
          uv run ruff check plugins/platforms/a2a/adapter.py tests/plugins/test_a2a_plugin.py tests/plugins/test_a2a_message_ids.py
          git diff --check
          git add plugins/platforms/a2a/adapter.py tests/plugins/test_a2a_message_ids.py
          git commit -m "fix(a2a): make reply message ids collision-safe"
          git push origin HEAD:codex/a2a-preserve-streamed-final
