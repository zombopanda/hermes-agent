name: Resolve PR 77402 conflict

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/resolve-77402.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/feat-cron-occurrence-env
          fetch-depth: 0
          persist-credentials: true

      - name: Merge upstream main, resolve conflict, validate, push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch upstream main

          set +e
          git merge --no-ff --no-commit upstream/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts:"
            printf '%s\n' "$conflicts"
            test "$conflicts" = "cron/scheduler.py"
            git checkout --theirs -- cron/scheduler.py

            python - <<'PY'
          from pathlib import Path

          path = Path("cron/scheduler.py")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f"expected upstream shape missing: {label}")
              text = text.replace(old, new, 1)

          replace_once(
              """def _run_job_script(\n    script_path: str,\n    workdir: Optional[str] = None,\n    cancel_event: Optional[_CancelEventLike] = None,\n) -> tuple[bool, str]:""",
              """def _run_job_script(\n    script_path: str,\n    workdir: Optional[str] = None,\n    job_env: Optional[dict[str, str]] = None,\n    cancel_event: Optional[_CancelEventLike] = None,\n) -> tuple[bool, str]:""",
              "_run_job_script signature",
          )
          replace_once(
              """        env = build_subprocess_env()\n        env.update(env_overlay)\n""",
              """        env = build_subprocess_env()\n        env.update(env_overlay)\n        if job_env:\n            env.update(job_env)\n""",
              "script subprocess env",
          )
          replace_once(
              """def _run_job_script_with_claim_heartbeat(\n    job: dict,\n    script_path: str,\n    workdir: Optional[str] = None,\n    cancel_event: Optional[_CancelEventLike] = None,\n) -> tuple[bool, str]:""",
              """def _run_job_script_with_claim_heartbeat(\n    job: dict,\n    script_path: str,\n    workdir: Optional[str] = None,\n    job_env: Optional[dict[str, str]] = None,\n    cancel_event: Optional[_CancelEventLike] = None,\n) -> tuple[bool, str]:""",
              "heartbeat signature",
          )

          old_call = "return _run_job_script(script_path, workdir=workdir, cancel_event=cancel_event)"
          count = text.count(old_call)
          if count < 3:
              raise SystemExit(f"expected >=3 heartbeat script calls, found {count}")
          text = text.replace(
              old_call,
              "return _run_job_script(script_path, workdir=workdir, job_env=job_env, cancel_event=cancel_event)",
          )

          replace_once(
              """            ok, output = _run_job_script_with_claim_heartbeat(\n                job, script_path, workdir=_job_workdir, cancel_event=cancel_event,\n            )""",
              """            ok, output = _run_job_script_with_claim_heartbeat(\n                job,\n                script_path,\n                workdir=_job_workdir,\n                job_env={\n                    \"HERMES_CRON_JOB_ID\": str(job_id),\n                    \"HERMES_CRON_OCCURRENCE_AT\": str(job.get(\"next_run_at\") or \"\"),\n                },\n                cancel_event=cancel_event,\n            )""",
              "no_agent occurrence env call",
          )

          path.write_text(text)
          PY
            git add cron/scheduler.py
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          python -m py_compile cron/scheduler.py
          python -m pip install --quiet uv
          uv run --extra dev pytest -q tests/cron/test_cron_script.py
          uv run ruff check cron/scheduler.py tests/cron/test_cron_script.py
          git diff --check
          git diff --cached --check

          git commit -m "Merge upstream main into agent/feat-cron-occurrence-env"
          git push origin HEAD:agent/feat-cron-occurrence-env
