name: Finish A2A review cleanup

on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-a2a-message-id.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/a2a-preserve-streamed-final
          fetch-depth: 1
          persist-credentials: true
      - name: Fix collision-prone A2A message IDs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          adapter = Path("plugins/platforms/a2a/adapter.py")
          text = adapter.read_text()
          if "import uuid\n" not in text:
              text = text.replace("import urllib.request\n", "import urllib.request\nimport uuid\n", 1)
          old = "        message_id = str(int(time.time() * 1000))\n"
          new = "        message_id = uuid.uuid4().hex\n"
          if old not in text:
              raise SystemExit("A2A message_id anchor changed")
          adapter.write_text(text.replace(old, new, 1))

          tests = Path("tests/plugins/test_a2a_plugin.py")
          t = tests.read_text()
          anchor = '''    def test_concurrent_same_context_tasks_resolve_fifo(self):
          '''
          addition = '''    def test_final_sends_use_unique_message_ids(self):
              """Back-to-back final sends must not collide within one millisecond."""
              adapter = _bare_adapter()

              async def run():
                  first = await adapter.send("ctx-1", "one", metadata={"notify": True})
                  second = await adapter.send("ctx-2", "two", metadata={"notify": True})
                  return first, second

              first, second = asyncio.run(run())
              assert first.success is True
              assert second.success is True
              assert first.message_id
              assert second.message_id
              assert first.message_id != second.message_id

              
              def test_concurrent_same_context_tasks_resolve_fifo(self):
          '''
          # Dedent the intentionally embedded class-method block to its real shape.
          addition = addition.replace("              def test_concurrent", "    def test_concurrent")
          if anchor not in t:
              raise SystemExit("A2A test insertion anchor changed")
          tests.write_text(t.replace(anchor, addition, 1))
          PY
          python -m pip install --quiet uv
          uv run --extra dev pytest -q tests/plugins/test_a2a_plugin.py tests/plugins/test_a2a_phase23.py
          uv run ruff check plugins/platforms/a2a/adapter.py tests/plugins/test_a2a_plugin.py
          git diff --check
          git add plugins/platforms/a2a/adapter.py tests/plugins/test_a2a_plugin.py
          git commit -m "fix(a2a): make reply message ids collision-safe"
          git push origin HEAD:codex/a2a-preserve-streamed-final
