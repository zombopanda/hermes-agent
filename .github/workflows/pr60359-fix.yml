name: Apply PR 60359 review fix

on:
  push:
    branches:
      - agent/channel-overrides-model-effort
    paths:
      - .github/workflows/pr60359-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message == 'chore: apply PR 60359 fix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/channel-overrides-model-effort
          fetch-depth: 2

      - uses: astral-sh/setup-uv@v6

      - name: Apply fix from previous one-shot script
        shell: bash
        run: |
          git show HEAD^:.github/workflows/pr60359-fix.yml > /tmp/pr60359-old.yml
          sed -n "/^[[:space:]]*python <<'PY'$/,/^[[:space:]]*PY$/p" /tmp/pr60359-old.yml \
            | sed '1d;$d;s/^          //' > /tmp/pr60359_fix.py
          python /tmp/pr60359_fix.py

      - name: Focused validation
        shell: bash
        run: |
          uv run --extra dev pytest -q \
            tests/gateway/test_channel_overrides.py \
            tests/gateway/test_config.py \
            tests/gateway/test_session_model_override_routing.py \
            tests/run_agent/test_provider_fallback.py \
            tests/run_agent/test_switch_model_reasoning_override.py
          uv run --extra dev ruff check \
            agent/agent_init.py \
            agent/agent_runtime_helpers.py \
            agent/chat_completion_helpers.py \
            gateway/run.py \
            tests/gateway/test_channel_overrides.py \
            tests/run_agent/test_provider_fallback.py \
            tests/run_agent/test_switch_model_reasoning_override.py
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/pr60359-fix.yml
          git add -- \
            agent/agent_init.py \
            agent/agent_runtime_helpers.py \
            agent/chat_completion_helpers.py \
            gateway/run.py \
            tests/gateway/test_channel_overrides.py \
            tests/run_agent/test_provider_fallback.py \
            tests/run_agent/test_switch_model_reasoning_override.py \
            website/docs/user-guide/messaging/index.md
          git diff --cached --check
          git commit -m "fix(gateway): preserve scoped reasoning across route changes"
          git push origin HEAD:agent/channel-overrides-model-effort
